name: Holiday posts

on:
  push:
    branches: [DEV]
    paths:
      - "bot.py"
      - "holidays_rules.py"
      - "channels.json"
      - "faiths.json"
      - "faith_holidays.py"
      - "requirements.txt"
      - ".github/workflows/holidays.yml"
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only print what would be posted, post nothing"
        type: boolean
        default: true
      date:
        description: "Pretend today is this date, as YYYY-MM-DD (dry run only, optional)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: holiday-posts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Celebrate today's holidays
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DRY_RUN: ${{ (github.event_name == 'schedule' && 'false') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run && 'false') || 'true' }}
          PRETEND_DATE: ${{ inputs.date }}
        run: python -W ignore bot.py

      - name: Keep the daily schedule turned on
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/holidays.yml/enable" && echo "Schedule kept on."
          fi
